name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libwebkit2gtk-4.1-dev

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja

      - name: Setup toolchain (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/setup-windows.ps1

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/configure.ps1

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build.ps1 -Config Debug

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Setup toolchain (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash scripts/setup-unix.sh

      - name: Configure (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash scripts/configure.sh Ninja build_unix Debug

      - name: Build (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash scripts/build.sh Debug build_unix

      - name: Test (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash scripts/test.sh build_unix Debug

  projucer-windows:
    name: Projucer Tool (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup toolchain
        shell: pwsh
        run: ./scripts/setup-windows.ps1

      - name: Configure Projucer
        shell: pwsh
        run: ./scripts/configure-projucer.ps1

      - name: Build Projucer
        shell: pwsh
        run: ./scripts/build-projucer.ps1 -Config Debug
